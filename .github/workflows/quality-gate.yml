# Third-party actions below are pinned to a full commit SHA, not a tag, per master-prompt
# §9. The trailing `# vX.Y.Z` comment names the human-readable release the SHA corresponds
# to; Renovate's `github-actions` manager tracks the pinned digest and opens an update PR
# (targeting `preview`, per renovate.json) when a newer release is published.
name: Quality Gate

on:
  pull_request:
    branches:
      - test

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Repo hygiene (actionlint, yamllint, markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint --config-file .yamllint.yml .

      - name: Run actionlint
        uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4  # v1.84.1
        with:
          reporter: local
          fail_level: error
          filter_mode: nofilter

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7  # v25.1.0
        with:
          config: .markdownlint.jsonc
          globs: "**/*.md"

  backend-quality:
    name: Backend quality (lint/format/type-check/unit tests)
    runs-on: ubuntu-latest
    # Activated by Phase 5 (Task #108) ahead of Phase 6's real modules -- lightweight
    # job-level postgres/redis services are enough for the pytest-django run here, not the
    # full Compose stack (that's what integration-validation.yml's compose-validate job is
    # for). redis added by Issue #129: DRF's ScopedRateThrottle (apps/identity/api) requires
    # a reachable cache backend on every request to the endpoints it guards, not just the
    # dedicated rate-limit test.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pizza_store
          POSTGRES_USER: pizza_store
          POSTGRES_PASSWORD: pizza_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pizza_store -d pizza_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: pizza_store
      POSTGRES_USER: pizza_store
      POSTGRES_PASSWORD: pizza_store
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Mypy
        run: mypy .

      - name: Pytest
        run: pytest

  frontend-quality:
    name: Frontend quality (lint/format/type-check/unit tests/e2e)
    runs-on: ubuntu-latest
    # Activated by Phase 5 (Task #109) ahead of Phase 7's real apps -- exercises the
    # throwaway smoke-app plus the permanent frontend/e2e/ Playwright harness.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npx prettier --check .

      - name: TypeScript (e2e harness)
        run: npm run typecheck

      - name: Build smoke-app (full Angular template type-check)
        run: npx ng build smoke-app

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e
        run: npm run e2e

  dataset-generation:
    name: Dataset generation (smoke tier)
    runs-on: ubuntu-latest
    # Activated by Phase 5 (Task #112) -- the routine CI check that scripts/dataset/generate.py
    # and verify.py keep working. The integration/load tiers are deliberately never run here
    # (master prompt §10: "must not overload CI"); they're only proven locally as PR evidence.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Install dataset generator dependencies
        run: pip install -r scripts/dataset/requirements.txt

      - name: Generate and verify the smoke tier
        run: python scripts/dataset/generate.py --tier smoke --output-dir /tmp/dataset-smoke --verify

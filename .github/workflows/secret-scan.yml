# Third-party actions below are pinned to a full commit SHA, not a tag, per master-prompt
# §9. The trailing `# vX.Y.Z` comment names the human-readable release the SHA corresponds
# to; Renovate's `github-actions` manager tracks the pinned digest and opens an update PR
# (targeting `preview`, per renovate.json) when a newer release is published.
#
# Third, repo-owned layer alongside the account-wide GitGuardian app (pre-existing, not part
# of this project) and GitHub's native secret scanning + push protection (already enabled on
# this repository's Settings -> Code security and analysis) — not a replacement for either.
name: Secret Scan

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR-comment feature needs `pull-requests: write`; this workflow intentionally
          # stays read-only (findings already surface via the job log and step summary).
          GITLEAKS_ENABLE_COMMENTS: "false"

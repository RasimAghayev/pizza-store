name: Dependency Scan

on:
  pull_request:
    branches:
      - test

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (Python dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      # Activated by Phase 5 (Task #108) ahead of Phase 6's real modules.
      - name: Run pip-audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt

  npm-audit:
    name: npm audit (npm dependency vulnerabilities)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Activated by Phase 5 (Task #109) ahead of Phase 7's real apps. --omit=dev
      # scopes this to runtime dependencies; dev-tooling CVEs are tracked separately
      # via Renovate/Dependabot, not blocked here.
      - name: Install frontend dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --omit=dev

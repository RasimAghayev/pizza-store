name: Dependency Scan

on:
  pull_request:
    branches:
      - test

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (Python dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      # Activated by Phase 5 (Task #108) ahead of Phase 6's real modules.
      - name: Run pip-audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt

  npm-audit:
    name: npm audit (npm dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      # job-level `if` can't call hashFiles(); the guard lives on the step instead.
      # Inert until Phase 7 (Epic #11) adds frontend/package.json.
      - name: Placeholder (active once package.json exists)
        if: ${{ hashFiles('**/package.json') != '' }}
        run: echo "package.json detected — wire npm audit --omit=dev here (Phase 7)."

# Third-party actions below are pinned to a full commit SHA, not a tag, per master-prompt
# §9. The trailing `# vX.Y.Z` comment names the human-readable release the SHA corresponds
# to; Renovate's `github-actions` manager tracks the pinned digest and opens an update PR
# (targeting `preview`, per renovate.json) when a newer release is published.
name: Integration Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - test

permissions:
  contents: read

env:
  # Deterministic Compose project name so this job's volumes/networks can be targeted
  # precisely during teardown verification, independent of the runner's working directory.
  COMPOSE_PROJECT_NAME: pizza-store-ci
  COMPOSE_FILE: infrastructure/compose/docker-compose.yml

jobs:
  compose-validate:
    name: Docker Compose stack validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Generate CI-only secrets and .env
        run: |
          cp .env.example .env
          for f in infrastructure/compose/secrets/*.txt.example; do
            cp "$f" "${f%.example}"
          done

      - name: Validate Compose file
        run: docker compose -f "$COMPOSE_FILE" --env-file .env config

      - name: Bring up the stack
        run: make up

      - name: Wait for all services to report healthy
        run: |
          # Phase 2 (Issue #55) observed every service reaching `healthy` within ~20-35s;
          # 90s gives comfortable headroom before this step fails the job. 12 of the 15
          # Compose services carry a healthcheck (postgres, mongodb, redis, rabbitmq, nginx,
          # prometheus, alertmanager, grafana, postgres-exporter, jaeger, backend, frontend --
          # the latter two added by Phase 6/7) -- loki, promtail, mongodb-exporter,
          # redis-exporter, and otel-collector are scratch/distroless images with no shell to
          # probe with and are intentionally excluded from this count. `-ge` rather than `-eq`
          # so this doesn't silently start timing out again the next time a service gains a
          # healthcheck without this count being updated to match.
          expected=12
          timeout=90
          interval=5
          elapsed=0
          while true; do
            healthy=$(docker compose -f "$COMPOSE_FILE" --env-file .env ps --format json \
              | jq -s 'flatten | map(select(.Health == "healthy")) | length')
            echo "Healthy: ${healthy}/${expected} (elapsed ${elapsed}s)"
            if [ "$healthy" -ge "$expected" ]; then
              exit 0
            fi
            if [ "$elapsed" -ge "$timeout" ]; then
              docker compose -f "$COMPOSE_FILE" --env-file .env ps
              docker compose -f "$COMPOSE_FILE" --env-file .env logs
              echo "Timed out waiting for all services to become healthy" >&2
              exit 1
            fi
            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

      - name: Tear down and verify clean removal
        if: always()
        run: |
          # `make down` intentionally keeps named volumes (Issue #55 validated this as the
          # correct behavior for local/persistent use); this ephemeral CI runner has no
          # reason to keep them, so `make clean` (down -v --remove-orphans) is used instead
          # to leave the runner's Docker state exactly as it found it.
          make clean
          leftover_volumes=$(docker volume ls --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" -q)
          leftover_networks=$(docker network ls --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" -q)
          if [ -n "$leftover_volumes" ] || [ -n "$leftover_networks" ]; then
            echo "Leftover volumes: $leftover_volumes" >&2
            echo "Leftover networks: $leftover_networks" >&2
            exit 1
          fi

  migration-upgrade-downgrade:
    name: Django migration upgrade/downgrade test
    runs-on: ubuntu-latest
    # Activated by Phase 5 (Task #110) against the one real migration Task #108's `health`
    # app produces -- proves the upgrade/downgrade mechanism itself works before Phase 6
    # starts adding real business-domain migrations on top of it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pizza_store
          POSTGRES_USER: pizza_store
          POSTGRES_PASSWORD: pizza_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pizza_store -d pizza_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: pizza_store
      POSTGRES_USER: pizza_store
      POSTGRES_PASSWORD: pizza_store
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Upgrade (apply all migrations from empty)
        run: python manage.py migrate

      - name: Downgrade (reverse the health app's migration back to nothing)
        run: python manage.py migrate health zero

      - name: Re-upgrade (confirm forward migration re-applies cleanly)
        run: python manage.py migrate

      - name: Assert final state is fully applied, not partial
        run: |
          output=$(python manage.py showmigrations health)
          echo "$output"
          if echo "$output" | grep -q '\[ \]'; then
            echo "health app has an unapplied migration after re-upgrade" >&2
            exit 1
          fi

  backend-frontend-integration:
    name: Backend/frontend integration tests (Playwright auth E2E)
    runs-on: ubuntu-latest
    # Independent of compose-validate (which tears its own stack down with `if: always()`
    # before this job could reuse it) -- brings up its own copy of the full stack instead.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate CI-only secrets and .env
        run: |
          cp .env.example .env
          for f in infrastructure/compose/secrets/*.txt.example; do
            cp "$f" "${f%.example}"
          done

      - name: Bring up the stack
        run: make up

      - name: Wait for all services to report healthy
        run: |
          # Same expectations as the compose-validate job above -- see its comment for the
          # 12/3 healthchecked/shell-less split.
          expected=12
          timeout=90
          interval=5
          elapsed=0
          while true; do
            healthy=$(docker compose -f "$COMPOSE_FILE" --env-file .env ps --format json \
              | jq -s 'flatten | map(select(.Health == "healthy")) | length')
            echo "Healthy: ${healthy}/${expected} (elapsed ${elapsed}s)"
            if [ "$healthy" -ge "$expected" ]; then
              exit 0
            fi
            if [ "$elapsed" -ge "$timeout" ]; then
              docker compose -f "$COMPOSE_FILE" --env-file .env ps
              docker compose -f "$COMPOSE_FILE" --env-file .env logs
              echo "Timed out waiting for all services to become healthy" >&2
              exit 1
            fi
            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

      - name: Run database migrations
        # `make up` only starts the containers -- backend/Dockerfile's CMD runs the dev
        # server directly with no migration step, so the schema doesn't exist yet without
        # this. Mirrors `make migrate`.
        run: docker compose -f "$COMPOSE_FILE" --env-file .env exec -T backend python manage.py migrate

      - name: Seed the Playwright fixture user
        # Calls RegistrationService directly (apps/identity/services/registration_service.py)
        # -- no registration HTTP endpoint exists (Issue #127/#141), so this is a one-off CI
        # seed via the internal service, not a production-facing path. Credentials must match
        # frontend/e2e/tests/auth-flow.spec.ts's FIXTURE_EMAIL/FIXTURE_PASSWORD exactly.
        run: |
          docker compose -f "$COMPOSE_FILE" --env-file .env exec -T backend python manage.py shell -c "
          from apps.identity.services.registration_service import RegistrationService
          from apps.identity.models import User
          email = 'e2e-auth@example.com'
          if not User.objects.filter(email=email).exists():
              RegistrationService().register(email=email, password='correct-horse-battery-staple')
          "

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the auth-flow E2E tests against the live stack
        working-directory: frontend
        run: npm run e2e:auth

      - name: Tear down and verify clean removal
        if: always()
        run: |
          make clean
          leftover_volumes=$(docker volume ls --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" -q)
          leftover_networks=$(docker network ls --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" -q)
          if [ -n "$leftover_volumes" ] || [ -n "$leftover_networks" ]; then
            echo "Leftover volumes: $leftover_volumes" >&2
            echo "Leftover networks: $leftover_networks" >&2
            exit 1
          fi

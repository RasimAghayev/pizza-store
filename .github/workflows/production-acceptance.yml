# Third-party actions below are pinned to a full commit SHA, not a tag, per master-prompt
# §9. The trailing `# vX.Y.Z` comment names the human-readable release the SHA corresponds
# to; Renovate's `github-actions` manager tracks the pinned digest and opens an update PR
# (targeting `preview`, per renovate.json) when a newer release is published.
#
# `branch-source-validation.yml` (Phase 0) already restricts `main` to only ever receive
# merge commits from already-validated `test -> main` PRs, so this workflow is a post-merge
# gate confirming what actually landed on `main`, not a pre-merge PR check.
name: Production Acceptance

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Deterministic Compose project name so this job's volumes/networks can be targeted
  # precisely during teardown verification, independent of the runner's working directory.
  COMPOSE_PROJECT_NAME: pizza-store-ci
  COMPOSE_FILE: infrastructure/compose/docker-compose.yml

jobs:
  compose-acceptance:
    name: Docker Compose stack acceptance (main)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Generate CI-only secrets and .env
        run: |
          cp .env.example .env
          for f in infrastructure/compose/secrets/*.txt.example; do
            cp "$f" "${f%.example}"
          done

      - name: Validate Compose file
        run: docker compose -f "$COMPOSE_FILE" --env-file .env config

      - name: Bring up the stack
        run: make up

      - name: Wait for all services to report healthy
        run: |
          # 12 of the 17 services declare a healthcheck (the other 5 -- loki, promtail,
          # mongodb-exporter, redis-exporter, otel-collector -- are shell-less/distroless
          # images with no healthcheck by design, see docs/deployment/swarm.md's
          # Troubleshooting section for the pattern). This count must track
          # integration-validation.yml's own `expected` value -- that workflow hit the same
          # stale-count bug once already (Issue #106, fixed only there) before this sibling
          # workflow hit it again with the exact same root cause (Issue #167's Phase 9 Gate
          # audit): a value hardcoded in Phase 2, when only 5 services existed, was never
          # updated as later phases added healthchecked services, so every run timed out
          # regardless of real stack health. 90s gives comfortable headroom once the count
          # is correct.
          expected=12
          timeout=90
          interval=5
          elapsed=0
          while true; do
            healthy=$(docker compose -f "$COMPOSE_FILE" --env-file .env ps --format json \
              | jq -s 'flatten | map(select(.Health == "healthy")) | length')
            echo "Healthy: ${healthy}/${expected} (elapsed ${elapsed}s)"
            if [ "$healthy" -eq "$expected" ]; then
              exit 0
            fi
            if [ "$elapsed" -ge "$timeout" ]; then
              docker compose -f "$COMPOSE_FILE" --env-file .env ps
              docker compose -f "$COMPOSE_FILE" --env-file .env logs
              echo "Timed out waiting for all services to become healthy" >&2
              exit 1
            fi
            sleep "$interval"
            elapsed=$((elapsed + interval))
          done

      - name: Tear down and verify clean removal
        if: always()
        run: |
          make clean
          leftover_volumes=$(docker volume ls --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" -q)
          leftover_networks=$(docker network ls --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" -q)
          if [ -n "$leftover_volumes" ] || [ -n "$leftover_networks" ]; then
            echo "Leftover volumes: $leftover_volumes" >&2
            echo "Leftover networks: $leftover_networks" >&2
            exit 1
          fi

  deploy-readiness:
    name: Deploy readiness (placeholder)
    runs-on: ubuntu-latest
    needs: compose-acceptance
    steps:
      # job-level `if` can't call hashFiles(); the guard lives on the step instead.
      # Both Dockerfiles now exist (Phase 6/7), so this guard is permanently true -- but no
      # Phase 8 (Deployment Infrastructure, Issues #157-#161) Task ever scoped a versioned
      # image build/push step here. Phase 8 validated VPS/Swarm/Kubernetes/Terraform targets
      # directly instead (see docs/deployment/, docs/cloud/); this job remains a deliberate,
      # out-of-scope placeholder, not a forgotten TODO.
      - name: Placeholder (active once a deployment Dockerfile exists)
        if: ${{ hashFiles('backend/Dockerfile') != '' || hashFiles('frontend/**/Dockerfile') != '' }}
        run: |
          echo "Dockerfile detected — wire versioned image build/push and a staging smoke"
          echo "test here (Phase 8)."

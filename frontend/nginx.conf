# Static-file stage for frontend/Dockerfile (Issue #140) -- serves customer-web's build
# output only; distinct from infrastructure/nginx/conf.d/default.conf, which is the edge
# proxy that forwards "/" to this container and "/api/" to the backend container.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Angular's client-side router needs every unmatched path to fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

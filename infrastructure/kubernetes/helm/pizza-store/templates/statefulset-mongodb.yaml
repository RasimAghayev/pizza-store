apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    {{- include "pizza-store.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "pizza-store.selectorLabels" (dict "root" . "component" "mongodb") | nindent 4 }}
  ports:
    - port: {{ .Values.ports.mongodb }}
      targetPort: {{ .Values.ports.mongodb }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    {{- include "pizza-store.labels" . | nindent 4 }}
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      {{- include "pizza-store.selectorLabels" (dict "root" . "component" "mongodb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pizza-store.selectorLabels" (dict "root" . "component" "mongodb") | nindent 8 }}
    spec:
      containers:
        - name: mongodb
          image: "{{ .Values.images.mongodb.repository }}:{{ .Values.images.mongodb.tag }}"
          imagePullPolicy: {{ .Values.images.mongodb.pullPolicy }}
          # args (not command) -- same ENTRYPOINT-preservation reason as postgres above.
          args: ["--auth"]
          ports:
            - containerPort: {{ .Values.ports.mongodb }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: {{ .Values.secrets.mongoRootUsername | quote }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: MONGO_ROOT_PASSWORD
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources.mongodb | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.mongodb.size }}

# Every value currently backed by a Compose secret file (infrastructure/compose/secrets/*.txt)
# or a Swarm secret (Issue #158) becomes a key in this one Secret object. Real installs
# supply real values via --set/-f on a gitignored values file -- values.yaml's defaults are
# placeholders only (see values.yaml's header comment).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "pizza-store.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  MONGO_ROOT_PASSWORD: {{ .Values.secrets.mongoRootPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}
  DJANGO_SECRET_KEY: {{ .Values.secrets.djangoSecretKey | quote }}
  JWT_PRIVATE_KEY: {{ .Values.secrets.jwtPrivateKey | quote }}

# The edge -- fronted externally by ingress.yaml, proxies internally to the backend/frontend
# Services via configmap-nginx.yaml's mirrored infrastructure/nginx/conf.d/default.conf.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    {{- include "pizza-store.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pizza-store.selectorLabels" (dict "root" . "component" "nginx") | nindent 4 }}
  ports:
    - port: {{ .Values.ports.nginx }}
      targetPort: {{ .Values.ports.nginx }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    {{- include "pizza-store.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.nginx }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "pizza-store.selectorLabels" (dict "root" . "component" "nginx") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pizza-store.selectorLabels" (dict "root" . "component" "nginx") | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.images.nginx.repository }}:{{ .Values.images.nginx.tag }}"
          imagePullPolicy: {{ .Values.images.nginx.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ports.nginx }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ports.nginx }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ports.nginx }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ .Release.Name }}-nginx-conf

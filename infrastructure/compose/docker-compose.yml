# Explicit project name (Compose Specification top-level `name:`) -- without it, Compose
# derives the project name from this directory's basename ("compose"), which is generic
# enough to collide with an unrelated project of the same directory name on a shared dev
# host: image tags (e.g. "compose-backend:latest") and container names are keyed off the
# project name, so a collision can silently run this service's container against another
# project's image instead of rebuilding.
name: pizza-store

networks:
  edge-net:
    driver: bridge
  data-net:
    driver: bridge
  # Metrics/logging/tracing containers (Phase 4). Dual-homed with data-net where a
  # service/exporter needs to reach a database directly; monitoring-net is how
  # Prometheus/Grafana reach those exporters and each other.
  monitoring-net:
    driver: bridge

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  # Dedicated least-privilege MongoDB monitoring user (clusterMonitor + read on local),
  # created by infrastructure/mongodb/init/01-create-exporter-user.sh — never the root user.
  mongodb_exporter_password:
    file: ./secrets/mongodb_exporter_password.txt
  # Same underlying password as redis_password, JSON-wrapped for redis_exporter's
  # -redis.password-file (see the redis-exporter service comment below for why).
  redis_exporter_password:
    file: ./secrets/redis_exporter_password.txt
  # Passphrase for gpg --symmetric backup-archive encryption (Task #96). Not mounted into
  # any service -- scripts/backup-*.sh and scripts/restore-*.sh read this file directly
  # from the host, since gpg runs there, not inside the postgres/mongodb containers.
  backup_encryption_key:
    file: ./secrets/backup_encryption_key.txt
  # Django SECRET_KEY for the backend service below (Issue #126, Phase 6) -- read via
  # backend/config/settings.py's _read_secret() helper, per ADR 0006.
  django_secret_key:
    file: ./secrets/django_secret_key.txt
  # RS256 JWT signing keypair (ADR 0006, Issue #129) -- generated via
  # scripts/generate-jwt-keypair.py; read by backend/apps/identity/services/token_service.py.
  # The public key is derived in-process, never stored as a second secret.
  jwt_private_key:
    file: ./secrets/jwt_private_key.txt

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Baseline audit logging (Task #93): connection/disconnection events plus every DDL
    # statement, shipped to Loki by promtail like every other container's stdout/stderr.
    command: ["postgres", "-c", "log_connections=on", "-c", "log_disconnections=on", "-c", "log_statement=ddl"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-net
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "1.0"

  mongodb:
    image: mongo:7
    restart: unless-stopped
    # Baseline audit logging (Task #93): --auth turns on real authentication enforcement
    # (previously only MONGO_INITDB_ROOT_* existed, without --auth mongod did not actually
    # require credentials) and logComponentVerbosity raises accessControl log verbosity so
    # auth attempts are visible. Confirmed by real test that this list-form command (it
    # starts with "-", so docker-entrypoint.sh prepends "mongod" itself) does not conflict
    # with first-run MONGO_INITDB_ROOT_* initialization.
    command: ["--auth", "--setParameter", "logComponentVerbosity={\"accessControl\":{\"verbosity\":1}}"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_password
      - mongodb_exporter_password
    volumes:
      - mongodb-data:/data/db
      - ../mongodb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-net
    ports:
      - "${MONGO_PORT}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "1.0"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c 'redis-server --requirepass "$$(cat /run/secrets/redis_password | tr -d "\r")" --appendonly yes'
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    networks:
      - data-net
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password | tr -d "\r")" ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: "0.5"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
    command: >
      sh -c 'export RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbitmq_password | tr -d "\r")" &&
      rabbitmq-plugins enable --offline rabbitmq_prometheus &&
      exec docker-entrypoint.sh rabbitmq-server'
    secrets:
      - rabbitmq_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - data-net
      # rabbitmq serves its own /metrics (rabbitmq_prometheus plugin, enabled above) —
      # scraped directly by Prometheus (Task #92), no separate exporter needed.
      - monitoring-net
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
      - "${RABBITMQ_PROMETHEUS_PORT}:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "1.0"

  # --- Phase 6 backend foundation (Issue #126) ---------------------------------------

  backend:
    build: ../../backend
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS}
    secrets:
      - django_secret_key
      - postgres_password
      - redis_password
      - rabbitmq_password
      - jwt_private_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # Joins edge-net too (Issue #140) so the edge nginx's "location /api/" proxy_pass can
    # reach this service -- the data-net-only restriction this comment used to describe
    # predates the Nginx-unified origin that Issue #140 actually builds; the host-published
    # port below is kept only for local debugging (e.g. Issue #131-style curl checks
    # against the backend directly), not for browser traffic, which goes through nginx.
    networks:
      - data-net
      - edge-net
    ports:
      - "${BACKEND_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "1.0"

  # --- Phase 7 frontend foundation (Issue #140) ---------------------------------------

  frontend:
    build: ../../frontend
    restart: unless-stopped
    networks:
      - edge-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: "0.5"

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - edge-net
    ports:
      - "${NGINX_HTTP_PORT}:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: "0.5"

  # --- Phase 4 observability stack (Task #92) -------------------------------------

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring-net
    ports:
      - "${PROMETHEUS_PORT}:9090"
    # calls alertmanager:9093 -- see prometheus.yml's alerting.alertmanagers block and the
    # alertmanager service below
    depends_on:
      - alertmanager
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: "1.0"

  # Receives alerts fired by Prometheus's alert-rules.yml -- see prometheus.yml's
  # alerting.alertmanagers block above. No real external notification channel is wired yet
  # (see alertmanager.yml's own comment and infrastructure/monitoring/README.md): this is a
  # documented, deliberate gap, not a silently missing one.
  alertmanager:
    image: prom/alertmanager:v0.35.1
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - monitoring-net
    ports:
      - "${ALERTMANAGER_PORT}:9093"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: "0.25"

  grafana:
    image: grafana/grafana:13.3.2
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-net
    ports:
      - "${GRAFANA_PORT}:3000"
    healthcheck:
      # Grafana 13's unified-storage/apiserver boot path takes longer than 11.x's did
      # (~70s observed locally) -- retries bumped from 5 to 10 so the healthcheck window
      # covers real startup time instead of reporting a transient false "unhealthy".
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Grafana 13's unified-storage/apiserver stack needs materially more headroom than
    # 11.x did; 256m caused SQLITE_BUSY retries and context-canceled errors under the
    # authz gRPC server during startup (observed locally), consistent with memory
    # pressure rather than a real incompatibility.
    mem_limit: 512m
    cpus: "1.0"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.21.1
    restart: unless-stopped
    # Unlike redis/rabbitmq above, this image's own ENTRYPOINT is the exporter binary
    # itself, not a wrapper script that execs "$@" — command: sh -c '...' alone would
    # just be passed as literal CLI args to that binary ("unexpected sh", a real failure
    # observed while validating this Task). entrypoint: must be overridden to a real
    # shell so the secret-file-read happens before the binary is exec'd.
    entrypoint: ["/bin/sh", "-c"]
    profiles: ["observability"]
    command:
      - >
        export DATA_SOURCE_NAME="postgresql://${POSTGRES_USER}:$$(cat /run/secrets/postgres_password |
        tr -d '\r')@postgres:5432/${POSTGRES_DB}?sslmode=disable" &&
        exec /bin/postgres_exporter
    secrets:
      - postgres_password
    networks:
      - data-net
      - monitoring-net
    ports:
      - "${POSTGRES_EXPORTER_PORT}:9187"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: "0.25"

  # percona/mongodb_exporter is a scratch-based, single-binary image: no shell, no wget/
  # curl, so neither the secret-file-read wrapper above nor a CMD-SHELL healthcheck is
  # possible (verified empirically, not assumed). It does not support a password-file
  # flag either (unlike redis_exporter below), so its credential is delivered via a
  # Compose-interpolated MONGODB_EXPORTER_PASSWORD (.env, gitignored, never committed —
  # see docs/security/secret-management.md for why this one credential is the documented
  # exception to the file-secret convention) for a dedicated, least-privilege monitoring
  # user (never the Mongo root user) created by infrastructure/mongodb/init/01-create-exporter-user.sh.
  # No healthcheck: Prometheus's own `up{job="mongodb"}` scrape result is the real signal.
  mongodb-exporter:
    image: percona/mongodb_exporter:0.54.0
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - --mongodb.uri=mongodb://mongodb_exporter:${MONGODB_EXPORTER_PASSWORD}@mongodb:27017/admin?authSource=admin
      - --collector.diagnosticdata
    networks:
      - data-net
      - monitoring-net
    ports:
      - "${MONGODB_EXPORTER_PORT}:9216"
    mem_limit: 128m
    cpus: "0.25"

  # oliver006/redis_exporter is also a scratch-based single binary (no shell/wget/curl —
  # verified empirically, so no healthcheck here either). It natively supports
  # -redis.password-file, so the password stays file-based — no .env exception needed —
  # but (a real finding, not assumed) that flag expects a JSON object keyed by address
  # ({"redis://host:port": "password"}), not the raw password string every other service
  # in this stack uses for its secret file. redis_exporter_password.txt therefore holds
  # the same password as redis_password.txt in that JSON shape, and the two must be kept
  # in sync by hand (documented in docs/security/secret-management.md).
  redis-exporter:
    image: oliver006/redis_exporter:v1.99.0
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - -redis.addr=redis://redis:6379
      - -redis.password-file=/run/secrets/redis_exporter_password
    secrets:
      - redis_exporter_password
    networks:
      - data-net
      - monitoring-net
    ports:
      - "${REDIS_EXPORTER_PORT}:9121"
    mem_limit: 128m
    cpus: "0.25"

  # --- Phase 4 logging & audit baseline (Task #93) --------------------------------

  # grafana/loki switched to a distroless, single-binary image: no shell, ls, wget, or curl
  # at all (verified empirically -- even `docker run --entrypoint ls` fails with "executable
  # file not found"), so no CMD-SHELL healthcheck is possible here, same situation as
  # mongodb-exporter/redis-exporter below. Loki's own startup log line ("Loki started") and,
  # functionally, promtail successfully pushing to it are the real signal.
  loki:
    image: grafana/loki:3.7.10
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ../logging/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - monitoring-net
    ports:
      - "${LOKI_PORT}:3100"
    mem_limit: 256m
    cpus: "0.5"

  # Promtail's image tag deliberately trails Loki's: Grafana has stopped publishing new
  # grafana/promtail image builds past 3.6.11 (the project is being wound down in favor of
  # Grafana Alloy), confirmed by checking Docker Hub directly rather than assuming -- 3.6.11
  # is the real current latest, not an arbitrary older pin.
  promtail:
    image: grafana/promtail:3.6.11
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ../logging/promtail-config.yml:/etc/promtail/config.yml:ro
      # Read-only: discovery and log-reading only, never container/daemon control.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring-net
    depends_on:
      loki:
        condition: service_started
    mem_limit: 128m
    cpus: "0.25"

  # --- Phase 4 tracing skeleton (Task #94) -----------------------------------------

  # In-memory storage only: traces are lost on restart. Acceptable for this baseline --
  # no application exists yet to emit real traces, and a persistent trace store is a
  # decision for Phase 6/7 once real retention requirements exist.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - monitoring-net
    ports:
      - "${JAEGER_UI_PORT}:16686"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: "0.5"

  # otel/opentelemetry-collector-contrib is a distroless, single-binary image (no shell, no
  # wget/curl -- verified empirically, same situation as loki above), so no CMD-SHELL
  # healthcheck is possible here either. Jaeger receiving the spans this collector forwards
  # (proven by the synthetic-span validation for this Task) is the real signal.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.166.0
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ../tracing/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - monitoring-net
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT}:4318"
    # calls jaeger:4317 (OTLP/gRPC) -- see infrastructure/tracing/otel-collector-config.yml
    depends_on:
      jaeger:
        condition: service_healthy
    mem_limit: 256m
    cpus: "0.5"

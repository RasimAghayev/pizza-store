# Edge proxy (Issue #140): unifies customer-web and backend under one origin so browser-mode
# cookie auth's SameSite=Strict cookies are attached (see docs/api/conventions.md's
# "Known limitation" section). No TLS termination here -- Compose-network-internal only.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # calls backend:8000 -- see backend/config/urls.py for the api/<version>/... mount
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # calls frontend:8080 -- see frontend/Dockerfile / frontend/nginx.conf
    location / {
        proxy_pass http://frontend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

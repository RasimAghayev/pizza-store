# Phase 2 (Issue #54 / Epic #6) placeholder: no backend/frontend upstream exists yet.
# Phase 6/7 replace the "/" location below with real proxy_pass directives once those
# containers exist.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 503 "No upstream configured yet — backend/frontend are wired up in Phase 6/7.\n";
        add_header Content-Type text/plain;
    }
}

# TLS-terminating edge proxy for the VPS deployment target (Issue #157, ADR 0007). Mirrors
# infrastructure/nginx/conf.d/default.conf's upstream routing exactly (backend:8000,
# frontend:8080) -- only the listen/TLS/redirect wrapper differs. Mounted in place of
# default.conf by infrastructure/compose/docker-compose.prod.yml's volumes override (same
# container path, different host directory) -- never alongside it, since both declare
# `server_name _;` on port 8080 and nginx rejects duplicate default servers.
#
# nosemgrep: insecure-ssl-version -- false positive: the Semgrep "generic" nginx ruleset isn't block-scoped, so it flags the plain-HTTP `listen 8080;` below even though that block never terminates TLS (the HTTPS block further down pins ssl_protocols explicitly).
# ssl_protocols/ssl_ciphers/ssl_prefer_server_ciphers below match the current (2026)
# TLSRef/Mozilla "Intermediate" server-side-TLS profile for nginx (TLS 1.2 + 1.3, client
# chooses cipher preference) -- see docs/deployment/vps.md's SSL section for the source.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # calls certbot's --webroot challenge directory -- see the certbot service in
    # docker-compose.prod.yml
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    # Fixed path, independent of any certbot --webroot domain name: a real VPS deployment's
    # certbot service copies/symlinks its issued cert here via --deploy-hook (see
    # docs/deployment/vps.md's SSL section for the exact bootstrap procedure); this Task's
    # own real test instead places a locally-trusted mkcert certificate at this same path,
    # since the disposable local stand-in host has no public DNS record for Let's Encrypt to
    # reach. Never generated inside this image, never committed (Security Requirements).
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # calls backend:8000 -- see backend/config/urls.py for the api/<version>/... mount
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # calls frontend:8080 -- see frontend/Dockerfile / frontend/nginx.conf
    location / {
        proxy_pass http://frontend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

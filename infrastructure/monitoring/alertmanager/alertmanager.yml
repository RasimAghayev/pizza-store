route:
  receiver: local-placeholder
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h

# No real external notification channel is wired yet (no Slack/email/PagerDuty integration):
# standing one up is an account-level integration decision outside this Task's scope, deferred
# until there is an actual on-call process to receive it. This receiver has no integrations
# configured at all, so Alertmanager accepts and displays every routed alert in its own
# UI/API without attempting (or failing) any outbound delivery -- a deliberate, documented gap,
# not a silently missing one. See infrastructure/monitoring/README.md.
receivers:
  - name: local-placeholder
